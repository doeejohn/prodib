<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lecteur Musical Pro Cloud 🎵</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<style>
body { font-family: Arial; background:#1e1e1e; color:#fff; text-align:center; padding:20px;}
input, button { margin:5px; padding:5px;}
audio { display:none; }
ul { list-style:none; padding:0;}
li { background:#333; margin:5px 0; padding:5px; border-radius:5px; cursor:pointer;}
li:hover { background:#555; }
li.active { background:#ff6b6b; }
.player-container { background:rgba(0,0,0,0.6); padding:20px; border-radius:15px; max-width:500px; margin:auto; }
.controls { display:flex; justify-content:center; gap:10px; margin-bottom:10px; }
button { background:#ff6b6b; border:none; padding:8px 15px; border-radius:8px; cursor:pointer; transition:0.2s;}
button:hover { background:#ff4b4b; }
.progress-container { width:100%; background:#555; border-radius:5px; cursor:pointer; height:8px; margin-bottom:10px;}
.progress { background:#ff6b6b; height:100%; width:0%; border-radius:5px; transition:width 0.1s linear;}
#visualizer { width:100%; height:50px; background:rgba(0,0,0,0.3); border-radius:5px; margin-bottom:10px;}
</style>
</head>
<body>

<h1>Lecteur Musical Pro Cloud 🎵</h1>

<input type="file" id="fileInput" accept="audio/*">
<button id="uploadBtn">Uploader</button>
<br><br>

<input type="text" id="searchUrl" placeholder="Rechercher par URL">
<button id="searchBtn">Rechercher</button>

<div class="player-container">
    <audio id="player"></audio>
    <canvas id="visualizer"></canvas>
    <div class="controls">
        <button id="prev">⏮️</button>
        <button id="playPause">▶️</button>
        <button id="next">⏭️</button>
        <button id="shuffle">🔀</button>
        <button id="repeat">🔁</button>
    </div>
    <div class="progress-container" id="progressContainer">
        <div class="progress" id="progress"></div>
    </div>
</div>

<ul id="playlist"></ul>

<script>
// ⚡ Config Supabase
const SUPABASE_URL = 'https://sfuiyxssdpejcntncggp.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNmdWl5eHNzZHBlamNudG5jZ2dwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI2ODM5MjUsImV4cCI6MjA3ODI1OTkyNX0.Sv9PDiEdjA755eZ-4Te9Iwt9dScxQVUVvfkD1NWyZS8';
const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ⚡ Éléments
const fileInput = document.getElementById('fileInput');
const uploadBtn = document.getElementById('uploadBtn');
const playlist = document.getElementById('playlist');
const player = document.getElementById('player');
const searchBtn = document.getElementById('searchBtn');
const searchUrl = document.getElementById('searchUrl');
const playPauseBtn = document.getElementById('playPause');
const nextBtn = document.getElementById('next');
const prevBtn = document.getElementById('prev');
const shuffleBtn = document.getElementById('shuffle');
const repeatBtn = document.getElementById('repeat');
const progress = document.getElementById('progress');
const progressContainer = document.getElementById('progressContainer');
const canvas = document.getElementById('visualizer');
const ctx = canvas.getContext('2d');

let currentTracks = [];
let currentIndex = 0;
let isPlaying = false;
let shuffle = false;
let repeat = false;
let audioCtx, analyser, source, dataArray;

// ===== Playlist =====
async function refreshPlaylist(){
    const { data } = await supabase.from('songs').select('*').order('uploaded_at', {ascending:false});
    playlist.innerHTML = '';
    currentTracks = data;
    data.forEach((song, index) => {
        const li = document.createElement('li');
        li.textContent = song.title;
        li.onclick = () => playTrack(index);
        playlist.appendChild(li);
    });
}

// ===== Jouer un morceau =====
function playTrack(index){
    const song = currentTracks[index];
    if(!song) return;
    currentIndex = index;
    player.src = song.url;
    player.play();
    isPlaying = true;
    playPauseBtn.textContent = '⏸️';
    currentTracks.forEach((_, i) => playlist.children[i].classList.toggle('active', i===index));
    setupVisualizer();
}

// ===== Upload =====
uploadBtn.addEventListener('click', async () => {
    if(fileInput.files.length === 0){ alert('Choisis un fichier !'); return; }
    const file = fileInput.files[0];
    const fileName = file.name;
    const { data, error } = await supabase.storage.from('songs').upload(fileName, file, {upsert:true});
    if(error){ alert(error.message); return; }
    const { publicURL } = supabase.storage.from('songs').getPublicUrl(fileName);
    await supabase.from('songs').insert([{ title:fileName, url:publicURL }]);
    refreshPlaylist();
    fileInput.value = '';
});

// ===== Recherche par URL =====
searchBtn.addEventListener('click', async () => {
    const url = searchUrl.value;
    if(!url) return;
    const { data } = await supabase.from('songs').select('*').eq('url', url);
    if(data.length>0){ playTrack(currentTracks.indexOf(data[0])); }
    else alert('Aucun résultat trouvé.');
});

// ===== Contrôles =====
playPauseBtn.addEventListener('click', ()=>{
    if(isPlaying){ player.pause(); playPauseBtn.textContent='▶️'; }
    else { player.play(); playPauseBtn.textContent='⏸️'; }
    isPlaying=!isPlaying;
});
nextBtn.addEventListener('click', nextTrack);
prevBtn.addEventListener('click', ()=>{
    currentIndex = (currentIndex-1+currentTracks.length)%currentTracks.length;
    playTrack(currentIndex);
});
shuffleBtn.addEventListener('click', ()=> shuffle=!shuffle);
repeatBtn.addEventListener('click', ()=> repeat=!repeat);

function nextTrack(){
    if(shuffle) currentIndex = Math.floor(Math.random()*currentTracks.length);
    else currentIndex = (currentIndex+1)%currentTracks.length;
    playTrack(currentIndex);
}

player.addEventListener('ended', ()=>{
    if(repeat) playTrack(currentIndex);
    else nextTrack();
});

// ===== Progress bar =====
player.addEventListener('timeupdate', ()=>{
    if(player.duration) progress.style.width=(player.currentTime/player.duration)*100+'%';
});
progressContainer.addEventListener('click', e=>{
    const width = progressContainer.clientWidth;
    const clickX = e.offsetX;
    player.currentTime = (clickX/width)*player.duration;
});

// ===== Visualizer =====
function setupVisualizer(){
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(source) source.disconnect();
    source = audioCtx.createMediaElementSource(player);
    analyser = audioCtx.createAnalyser();
    source.connect(analyser);
    analyser.connect(audioCtx.destination);
    analyser.fftSize=256;
    dataArray = new Uint8Array(analyser.frequencyBinCount);
    drawVisualizer();
}

function drawVisualizer(){
    requestAnimationFrame(drawVisualizer);
    if(!analyser) return;
    analyser.getByteFrequencyData(dataArray);
    ctx.clearRect(0,0,canvas.width,canvas.height);
    const barWidth = (canvas.width/dataArray.length);
    dataArray.forEach((value,i)=>{
        const barHeight = value/2;
        ctx.fillStyle=`rgb(${value+100},50,${255-value})`;
        ctx.fillRect(i*barWidth, canvas.height-barHeight, barWidth, barHeight);
    });
}

window.addEventListener('resize', ()=>{
    canvas.width=canvas.clientWidth;
    canvas.height=canvas.clientHeight;
});
canvas.width=canvas.clientWidth;
canvas.height=canvas.clientHeight;

// ===== Service Worker =====
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').then(()=>console.log('SW enregistré'));

// ===== Initialisation =====
refreshPlaylist();

</script>
</body>
</html>
